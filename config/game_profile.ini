[identity]
profile_version = 3
profile_name = Top Gear USA - Las Vegas - v3 base experimental
rom_sha1 = f686806c676a4b087a3627babbe3555d3704e3b1
profile_validated = true

[validation]
# So mude para true depois de comparar a tabela/overlay com os carros na tela.
opponent_telemetry_validated = true
# Confirmado por duas coletas rotuladas (36/36) e por 3600 frames com overlay.
surface_telemetry_validated = true
# Confirmado pela tabela completa de 704 entradas e por 12/12 rotulos visuais.
curve_telemetry_validated = true

[protocol]
protocol_version = 2
transport = socket
socket_host = 127.0.0.1
socket_port = 55355
startup_timeout_seconds = 180.0
timeout_seconds = 10.0
frame_repeat = 4
post_reset_frames = 0
savestate_slot = 1
max_repeat_frames = 60

[memory]
memory_domain = WRAM
speed_address = 0x1E5A
lateral_address = 0x1E8A
progress_fraction_address = 0x1ED7
progress_address = 0x1ED7
curve_progress_address = 0x0046
lap_address = 0x1E76
rank_address = 0x1E7A
final_rank_address = 0x1F00
collision_flags_address = 0x1EF5
surface_state_address = 0x0727
fuel_address = 0x1E62
nitro_address = 0x1E6C
gear_address = 0x1E72
total_laps_address = 0x1E56
track_length_address = 0x0200
racer_table_base = 0x0212
racer_record_stride = 0x12
racer_count = 20

[controls]
controls_validated = true
accelerate_button = X
brake_button = Y
turbo_button = A
enable_turbo = true

[geometry]
# Mantidos apenas como referencia para a coordenada lateral; offtrack agora vem
# diretamente do estado ternario validado em surface_state_address.
lateral_center = 0
track_half_width = 0
surface_left_value = 0
surface_road_value = 1
surface_right_value = 2
# A rotina de sobreposicao compara a diferenca lateral/2 com 0x0800.
# Na escala original de lateral, isso equivale a 0x1000 = 4096.
same_lane_half_width = 4096
opponent_sensor_fraction = 0.10
# A ROM indexa estas tabelas em offset 2*floor(posicao_suavizada/32),
# equivalente a (posicao >> 4) & 0xFFFE.
# 0x4000 participa da fisica longitudinal (inclinacao/grade candidato).
# Em 0x4C00, a rotina carrega um word, mas entrega o byte baixo assinado ao
# multiplicador que calcula o efeito lateral da curva.
# 0x5800 seleciona o tipo/limites locais da pista.
# 0x7002 contem limites laterais usados nas rotinas de competidores.
geometry_table_a = 0x4000
geometry_table_b = 0x7002
lateral_curve_table = 0x4C00
road_type_table = 0x5800

[normalization]
# A corrida manual validada atingiu 13677; evita saturacao observada com 6400.
speed_scale = 16384
lateral_scale = 32768
fuel_scale = 65535
nitro_scale = 3
gear_scale = 8
curve_scale = 32
# Escala de derivada calculada, em unidades de progresso por frame (nao km/h).
closing_rate_scale = 64

[reward]
progress_weight = 2.0
rank_delta_weight = 0.50
collision_penalty = 1.50
offtrack_penalty = 0.02
finish_bonus = 20.0
finish_rank_bonus = 10.0
first_place_bonus = 30.0
failure_penalty = 5.0
max_progress_fraction_per_step = 0.10

[episode]
# Limite em decisoes de 4 frames para lap=-1; nao representa deteccao do GO.
prestart_max_steps = 600
max_steps = 10000
no_progress_steps = 300
progress_epsilon = 0

[experiment]
# Correcao documentada apos regressao: objetivo de corrida, sensores preservados.
reward_profile = road_v5_race
track_length_expected = 22528
total_laps_expected = 3
curve_table_adler32 = 1669863105

[ppo]
n_steps = 2048
batch_size = 64
n_epochs = 10
# Horizonte maior para chegada/nitro; comparar com 0.99 e 0.995 em treinos separados.
gamma = 0.999
gae_lambda = 0.95
learning_rate = 0.0003
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.03
torch_threads = 1
